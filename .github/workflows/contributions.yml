name: Atualizar contribuições

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/update_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar calendário
        run: python3 scripts/update_contributions.py
      - name: Salvar calendário
        run: |
          git add src/profile/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualiza calendário de contribuições'
          git push
